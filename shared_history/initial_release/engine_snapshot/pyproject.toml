[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "recheck-repairlens-research"
version = "0.1.0"
description = "Auditable controlled studies for evidence refresh and productive repair"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "matplotlib>=3.7", "tabulate>=0.9"]
[project.optional-dependencies]
test = ["pytest>=7"]
audit = ["PyMuPDF>=1.24"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["src*"]
